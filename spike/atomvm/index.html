<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Lattice AtomVM Phase-0 spike</title>
  </head>
  <body>
    <main id="app" data-atomvm-ready="false" data-ws-supported="?">
      <h1>AtomVM Phase-0 spike harness</h1>
    </main>
    <script>
      // Driver reads these.
      window.__avmOut = [];
      window.__avmErr = [];
      // The web bundle is NOT modularized, but in the browser a global `var Module`
      // declared before the script tag IS picked up by the bundle.
      var Module = {
        // The bundle hardcodes the generic "AtomVM.wasm"; point it at the pinned asset.
        locateFile: function (p) {
          return p.endsWith(".wasm") ? "AtomVM-web-v0.7.0-alpha.1.wasm" : p;
        },
        // app first, stdlib second (matches the working node co-load).
        arguments: ["spike.avm", "atomvmlib.avm"],
        print: function (s) { window.__avmOut.push(String(s)); },
        printErr: function (s) { window.__avmErr.push(String(s)); },
        onAbort: function (e) {
          window.__avmErr.push("ABORT:" + e);
          document.getElementById("app").setAttribute("data-atomvm-ready", "abort");
        },
      };
    </script>
    <script async src="AtomVM-web-v0.7.0-alpha.1.js"></script>
  </body>
</html>
