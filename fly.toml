app = "lattice-demo-wss"
primary_region = "iad"

[build]
  dockerfile = "deploy/fly-demo/Dockerfile"

[env]
  DEMO_ECOSYSTEM_DIR = "/data/demo_ecosystem"
  PHX_HOST = "lattice-demo-wss.fly.dev"

[mounts]
  source = "lattice_demo_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/livez"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
