[package]
name = "township-tauri-shell"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"

[lib]
name = "township_tauri_shell"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
keyring = "4"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
tauri = "2.11.5"

[build-dependencies]
tauri-build = "2.6.3"

[dev-dependencies]
serde = "1"
serde_json = "1"
tauri = { version = "2.11.5", default-features = false, features = ["test"] }
