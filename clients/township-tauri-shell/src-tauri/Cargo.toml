[package]
name = "township-tauri-shell"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"

[lib]
name = "township_tauri_shell"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
township-dev-trace = []
township-governance-test-presence = []
township-ios-key-reuse-native-probe = []

[dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
keyring = "4"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-deep-link = "2.4.9"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSPasteboard",
] }
objc2-foundation = { version = "0.3", features = ["NSError", "NSString"] }
objc2-local-authentication = { version = "0.3", default-features = false, features = ["LAContext"] }
security-framework = { version = "3.7", features = ["OSX_10_15"] }
security-framework-sys = "2.17"

[target.'cfg(target_os = "ios")'.dependencies]
keyring-core = "1.0.0"
objc2-foundation = { version = "0.3", features = ["NSPathUtilities", "NSString"] }

[target.'cfg(target_os = "ios")'.dependencies.apple-native-keyring-store]
version = "1.0.0"
features = ["protected"]

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1.0.0"
keyring-core = "1.0.0"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dev-dependencies]
tauri = { version = "2.11.5", default-features = false, features = ["test"] }
