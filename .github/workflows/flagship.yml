name: Flagship evidence

on:
  push:
    branches:
      - main
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - 'docs/android_pilot_*'
      - 'docs/android_pilot_*/**'
      - 'plans/15[89]-*'
  pull_request:
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - 'docs/android_pilot_*'
      - 'docs/android_pilot_*/**'
      - 'plans/15[89]-*'
  workflow_dispatch:
    inputs:
      require_android_pilot:
        description: Fail unless protected pilot signing inputs produce a distribution artifact
        required: false
        type: boolean
        default: false

concurrency:
  group: flagship-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify flagship artifact
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: "28.1"
          elixir-version: "1.19.5"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            clients/lattice-client/package-lock.json
            clients/lattice-mobile-core/package-lock.json
            clients/township-tauri-shell/package-lock.json

      - name: Install Elixir dependencies
        run: mix deps.get

      - name: Install Node dependencies
        run: |
          npm ci
          npm --prefix clients/lattice-client ci
          npm --prefix clients/lattice-mobile-core ci
          npm --prefix clients/township-tauri-shell ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Verify flagship evidence path
        env:
          LATTICE_SKIP_DEPS: "1"
          LATTICE_SKIP_PLAYWRIGHT_INSTALL: "1"
        run: scripts/lattice_verify_flagship.sh

      - name: Upload evidence artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lattice-flagship-evidence
          if-no-files-found: warn
          path: |
            output/playwright/
            output/flagship/

  unit:
    name: Unit + property suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: "28.1"
          elixir-version: "1.19.5"
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            clients/lattice-client/package-lock.json
            clients/lattice-mobile-core/package-lock.json
            clients/township-tauri-shell/package-lock.json
      - name: Cache deps and _build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-
      - name: Cache Cargo dependencies and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            clients/township-tauri-shell/src-tauri/target
          key: ${{ runner.os }}-${{ runner.arch }}-township-tauri-${{ hashFiles('clients/lattice-mobile-core/native/Cargo.lock', 'clients/lattice-mobile-core/native/src/**/*.rs', 'clients/lattice-mobile-core/native/tests/**/*.rs', 'clients/township-tauri-shell/src-tauri/Cargo.lock', 'clients/township-tauri-shell/src-tauri/src/**/*.rs', 'clients/township-tauri-shell/src-tauri/tests/**/*.rs') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-township-tauri-
      - name: Install dependencies
        run: mix deps.get
      - name: Check formatting
        run: mix format --check-formatted
      - name: Run full test suite
        run: mix test
      - name: Regenerate TS oracle vectors
        # Run in :test env, not the default :dev env. A cache-restored _build/dev can
        # carry .beam mtimes newer than the freshly checked-out .ex sources, so Mix's
        # staleness check skips recompiling and this task silently runs stale code —
        # observed in CI regenerating a pre-session 9-scenario vector set instead of
        # the current 19. `mix test` (above) just forced a correct :test recompile in
        # this same job, so reuse that env instead of trusting :dev's staleness check.
        run: MIX_ENV=test mix lattice.export_vectors --out clients/lattice-client/test/vectors
      - name: Install TS client dependencies
        working-directory: clients/lattice-client
        run: npm ci
      - name: Typecheck TS client
        working-directory: clients/lattice-client
        run: npm run typecheck
      - name: TS client conformance
        working-directory: clients/lattice-client
        run: npm run conformance
      - name: TS V-01 authority fail-closed guard
        working-directory: clients/lattice-client
        run: npm run v01:guard
      - name: TS canonical op parity
        working-directory: clients/lattice-client
        run: npm run canonical
      - name: TS Township authoring
        working-directory: clients/lattice-client
        run: npm run township:authoring
      - name: TS Tauri bridge
        working-directory: clients/lattice-client
        run: npm run tauri:bridge
      - name: TS carrier availability feed contract
        working-directory: clients/lattice-client
        run: npm run carrier:feed
      - name: TS witnessed succession review
        working-directory: clients/lattice-client
        run: npm run succession:review
      - name: TS witnessed succession artifact
        working-directory: clients/lattice-client
        run: npm run succession:artifact
      - name: Build TS client for shell feed gate
        working-directory: clients/lattice-client
        run: npm run build
      - name: Install TS mobile core dependencies
        working-directory: clients/lattice-mobile-core
        run: npm ci
      - name: Build TS mobile core
        working-directory: clients/lattice-mobile-core
        run: npm run build
      - name: Install Tauri shell dependencies
        working-directory: clients/township-tauri-shell
        run: npm ci
      - name: TS Township shell typecheck
        working-directory: clients/township-tauri-shell
        run: npm run typecheck
      - name: TS Township runtime wiring contract
        working-directory: clients/township-tauri-shell
        run: npm run runtime:wiring:contract
      - name: TS governance witness native bridge
        working-directory: clients/township-tauri-shell
        run: npm run governance:native:contract
      - name: TS Township native workflow
        working-directory: clients/township-tauri-shell
        run: npm run native:contract
      - name: TS Township intent UI behavior
        working-directory: clients/township-tauri-shell
        run: npm run intent-ui:contract
      - name: TS Township action handoff support contract
        working-directory: clients/township-tauri-shell
        run: npm run action-handoff-support:contract
      - name: TS Township action-intent contract
        working-directory: clients/township-tauri-shell
        run: npm run action-intent:contract
      - name: TS Township deep-link dispatcher contract
        working-directory: clients/township-tauri-shell
        run: npm run deeplink:dispatcher:contract
      - name: TS Township action contract
        working-directory: clients/township-tauri-shell
        run: npm run action:contract
      - name: TS Township delegation-grant fixture
        working-directory: clients/township-tauri-shell
        run: npm run grant:fixture:contract
      - name: TS Township frontend contract
        working-directory: clients/township-tauri-shell
        run: npm run frontend:contract
      - name: TS Township carrier sync contract
        working-directory: clients/township-tauri-shell
        run: npm run sync:contract
      - name: TS reactive Township feed controller
        working-directory: clients/township-tauri-shell
        run: npm run feed:app:contract
      - name: TS live stable carrier availability feed
        working-directory: clients/township-tauri-shell
        run: npm run feed:contract
      - name: TS Township carrier peer contract
        working-directory: clients/township-tauri-shell
        run: npm run peer:contract
      - name: TS Township pairing deep-link contract
        working-directory: clients/township-tauri-shell
        run: npm run deeplink:contract
      - name: TS Township pairing deep-link source contract
        working-directory: clients/township-tauri-shell
        run: npm run deeplink:source:contract
      - name: TS Township pairing QR contract
        working-directory: clients/township-tauri-shell
        run: npm run qr:contract
      - name: TS Township pairing QR camera contract
        working-directory: clients/township-tauri-shell
        run: npm run qr:camera:contract
      - name: TS Township pairing discovery contract
        working-directory: clients/township-tauri-shell
        run: npm run discovery:contract
      - name: TS Township canonical probe contract
        working-directory: clients/township-tauri-shell
        run: npm run canonical:probe:contract
      - name: TS mobile secure-store strategy
        working-directory: clients/township-tauri-shell
        run: npm run mobile:strategy
      - name: TS Township witness artifact contract
        working-directory: clients/township-tauri-shell
        run: npm run witness:artifact:contract
      - name: TS Township packaged bundle variant contract
        working-directory: clients/township-tauri-shell
        run: npm run bundle:variant:contract
      - name: TS Township revocation fixture contract
        working-directory: clients/township-tauri-shell
        run: npm run revocation:fixture:contract
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - name: Tauri native command core
        working-directory: clients/township-tauri-shell/src-tauri
        run: cargo test
      - name: Mobile core native migration matrix
        working-directory: clients/lattice-mobile-core/native
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/clients/township-tauri-shell/src-tauri/target
        run: cargo test
      - name: TS Township witness fixture preflight
        working-directory: clients/township-tauri-shell
        run: npm run witness:preflight:contract
      - name: Tauri development trace contract
        working-directory: clients/township-tauri-shell/src-tauri
        run: cargo test --features township-dev-trace --test dev_trace_commands
      - name: TS carrier Township check
        working-directory: clients/lattice-client
        run: npm run carrier:township
      - name: TS one-op carrier relay check
        working-directory: clients/lattice-client
        run: npm run carrier:relay
      - name: TS relay-aware carrier sync check
        working-directory: clients/lattice-client
        run: npm run carrier:relay-sync
      - name: TS live carrier Township check
        working-directory: clients/lattice-client
        run: npm run carrier:township:live
      - name: Credo (strict)
        run: mix credo --strict
      - name: Sobelow (lattice_server)
        run: cd apps/lattice_server && mix sobelow --exit
      - name: Sobelow (township_web)
        run: cd apps/township_web && mix sobelow --exit

  packaged_macos:
    name: Packaged macOS convergence
    runs-on: macos-15-intel
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: "28.1"
          elixir-version: "1.19.5"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            clients/lattice-client/package-lock.json
            clients/lattice-mobile-core/package-lock.json
            clients/township-tauri-shell/package-lock.json

      - name: Cache Cargo dependencies and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            clients/township-tauri-shell/src-tauri/target
          key: ${{ runner.os }}-${{ runner.arch }}-township-tauri-${{ hashFiles('clients/township-tauri-shell/src-tauri/Cargo.lock', 'clients/township-tauri-shell/src-tauri/src/**/*.rs') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-township-tauri-

      - name: Install Elixir dependencies
        run: env MIX_ENV=test mix deps.get

      - name: Compile BEAM support
        run: env MIX_ENV=test mix compile

      - name: Install Township esbuild binary
        run: env MIX_ENV=test mix esbuild.install --if-missing

      - name: Install client and shell dependencies
        run: |
          npm ci
          npm --prefix clients/lattice-client ci
          npm --prefix clients/lattice-client run build
          npm --prefix clients/lattice-mobile-core ci
          npm --prefix clients/lattice-mobile-core run build
          npm --prefix clients/township-tauri-shell ci

      - name: Verify ordinary macOS governance custody binding
        working-directory: clients/township-tauri-shell/src-tauri
        run: cargo test --test governance_release_binding

      - name: Install shell Playwright browser
        working-directory: clients/township-tauri-shell
        run: npx --no-install playwright install chromium

      - name: Build packaged governance test-presence variant
        working-directory: clients/township-tauri-shell
        run: npm run tauri:build:governance-test-presence

      - name: Verify packaged witness ceremony
        working-directory: clients/township-tauri-shell
        run: npm run tauri:witness-ceremony:smoke

      - name: Verify packaged stable-relay onboarding
        working-directory: clients/township-tauri-shell
        run: npm run tauri:stable-relay:onboarding:smoke

      - name: Verify packaged action handoff
        working-directory: clients/township-tauri-shell
        run: npm run tauri:action-handoff:smoke

      - name: Verify packaged clerk status handoff
        working-directory: clients/township-tauri-shell
        env:
          TOWNSHIP_SKIP_CLERK_ACTION_APP_BUILD: "1"
        run: npm run tauri:clerk-action-handoff:smoke

      - name: Verify packaged field edit handoff
        working-directory: clients/township-tauri-shell
        env:
          TOWNSHIP_SKIP_FIELD_ACTION_APP_BUILD: "1"
        run: npm run tauri:field-action-handoff:smoke

      - name: Verify packaged roster handoff
        working-directory: clients/township-tauri-shell
        env:
          TOWNSHIP_SKIP_ROSTER_ACTION_APP_BUILD: "1"
        run: npm run tauri:roster-action-handoff:smoke

      - name: Verify packaged delegation grant handoff
        working-directory: clients/township-tauri-shell
        env:
          TOWNSHIP_SKIP_DELEGATION_GRANT_APP_BUILD: "1"
        run: npm run tauri:delegation-grant-handoff:smoke

      - name: Verify packaged revocation handoff
        working-directory: clients/township-tauri-shell
        run: npm run tauri:revocation-action-handoff:smoke

      - name: Verify packaged reactive carrier feed
        working-directory: clients/township-tauri-shell
        run: npm run tauri:feed:smoke

  carrier_release:
    name: Packaged carrier restart durability
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: "28.1"
          elixir-version: "1.19.5"
      - name: Cache carrier release dependencies
        # Cache dependencies only. A restored _build could let the packaged
        # restart test execute stale BEAM artifacts instead of this checkout.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: deps
          key: ${{ runner.os }}-carrier-release-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-carrier-release-
      - name: Install dependencies
        run: mix deps.get
      - name: Build, crash, restart, and verify the packaged pilot
        run: mix test apps/lattice_carrier_server/test/release_test.exs --include packaged_release

  android_pilot_contract:
    name: Android pilot security contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: clients/township-tauri-shell/package-lock.json

      - name: Install Android pilot contract dependencies
        run: npm --prefix clients/township-tauri-shell ci

      - name: Android pilot + harness contracts
        working-directory: clients/township-tauri-shell
        run: npm run android:pilot:contract

  android_pilot_verify:
    # Secret-free verification runs on every event. Its throwaway certificate
    # is never called pilot and its APK is never uploaded for distribution.
    name: Android signing-path verification
    needs: android_pilot_contract
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            clients/lattice-client/package-lock.json
            clients/lattice-mobile-core/package-lock.json
            clients/township-tauri-shell/package-lock.json

      - name: Install Android NDK and Rust target
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;27.1.12297006" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          rustup target add aarch64-linux-android
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"

      - name: Install client and shell dependencies
        run: |
          npm --prefix clients/lattice-client ci
          npm --prefix clients/lattice-mobile-core ci
          npm --prefix clients/township-tauri-shell ci

      - name: Materialize ephemeral verification key
        run: |
          set -eu
          KS="$RUNNER_TEMP/township-signing.jks"
          STOREPASS="ephemeral-ci-$(head -c16 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          echo "::add-mask::$STOREPASS"
          keytool -genkeypair -keystore "$KS" -alias township-pilot-v1 \
            -keyalg RSA -keysize 2048 -validity 2 \
            -storepass "$STOREPASS" -keypass "$STOREPASS" \
            -dname "CN=Township CI Ephemeral Throwaway - NOT PILOT, O=CI Test Only"
          (umask 077; printf '%s' "$STOREPASS" > "$RUNNER_TEMP/ephemeral-storepass")
          keytool -exportcert -keystore "$KS" -alias township-pilot-v1 \
            -storepass "$STOREPASS" -rfc > "$RUNNER_TEMP/ephemeral-cert.pem"
          EPHEMERAL_SHA=$(openssl x509 -in "$RUNNER_TEMP/ephemeral-cert.pem" -outform DER | sha256sum | cut -d' ' -f1)
          echo "EPHEMERAL_CERT_SHA256=$EPHEMERAL_SHA" >> "$GITHUB_ENV"
          echo "TOWNSHIP_PILOT_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"

      - name: Build signed release APK (ephemeral verification path)
        working-directory: clients/township-tauri-shell
        env:
          TOWNSHIP_ANDROID_VERSION_BAND: off-main
        run: |
          set -eu
          STOREPASS="$(cat "$RUNNER_TEMP/ephemeral-storepass")"
          export TOWNSHIP_PILOT_KEYSTORE_PASSWORD="$STOREPASS"
          export TOWNSHIP_PILOT_KEY_PASSWORD="$STOREPASS"
          export TOWNSHIP_PILOT_KEY_ALIAS=township-pilot-v1
          TOWNSHIP_ANDROID_VERSION_CODE="$(node scripts/android-pilot/version_code.mjs)"
          export TOWNSHIP_ANDROID_VERSION_CODE
          echo "versionCode=$TOWNSHIP_ANDROID_VERSION_CODE"
          npm run tauri:android:build:release -- --target aarch64

      - name: Verify ephemeral signing certificate
        working-directory: clients/township-tauri-shell
        run: |
          set -eu
          APK=src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
          mkdir -p ../../output/android-pilot-verification
          node scripts/android-pilot/verify_apk_signature.mjs --apk "$APK" \
            --lineage ephemeral-ci-throwaway --expected-cert-sha256 "$EPHEMERAL_CERT_SHA256" \
            --json ../../output/android-pilot-verification/signature.json

      - name: Scan verification artifact for probe/env-seed markers and CSP
        working-directory: clients/township-tauri-shell
        run: |
          set -eu
          APK=src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
          node scripts/android-pilot/scan_pilot_artifact.mjs --apk "$APK" --dist dist \
            --json ../../output/android-pilot-verification/scan.json
          node scripts/android-pilot/emit_build_manifest.mjs --apk "$APK" \
            --lineage ephemeral-ci-throwaway --out ../../output/android-pilot-verification

      - name: Prove fail-closed refusal without signing inputs
        working-directory: clients/township-tauri-shell/src-tauri/gen/android
        env:
          TOWNSHIP_ANDROID_SIGNING: pilot
          TOWNSHIP_PILOT_KEYSTORE_PATH: ""
          TOWNSHIP_PILOT_KEYSTORE_PASSWORD: ""
          TOWNSHIP_PILOT_KEY_PASSWORD: ""
        run: |
          set -eu
          PILOT_REFUSAL_LOG="$RUNNER_TEMP/pilot-refusal.log"
          UNSET_REFUSAL_LOG="$RUNNER_TEMP/unset-refusal.log"
          if ./gradlew --no-daemon -q packageUniversalRelease \
              -x rustBuildArm64Release -x rustBuildArmRelease \
              -x rustBuildX86Release -x rustBuildX86_64Release \
              -x rustBuildUniversalRelease > "$PILOT_REFUSAL_LOG" 2>&1; then
            echo "pilot-mode packaging must refuse without signing inputs" >&2
            exit 1
          fi
          if ! grep -q "TOWNSHIP_PILOT_KEYSTORE_PATH is not set" "$PILOT_REFUSAL_LOG"; then
            echo "expected pilot-mode keystore refusal; bounded diagnostics follow:" >&2
            tail -n 80 "$PILOT_REFUSAL_LOG" >&2
            exit 1
          fi
          if TOWNSHIP_ANDROID_SIGNING="" ./gradlew --no-daemon -q packageUniversalRelease \
              -x rustBuildArm64Release -x rustBuildArmRelease \
              -x rustBuildX86Release -x rustBuildX86_64Release \
              -x rustBuildUniversalRelease > "$UNSET_REFUSAL_LOG" 2>&1; then
            echo "unset-mode packaging must refuse" >&2
            exit 1
          fi
          if ! grep -q "release signing is fail-closed" "$UNSET_REFUSAL_LOG"; then
            echo "expected unset-mode refusal; bounded diagnostics follow:" >&2
            tail -n 80 "$UNSET_REFUSAL_LOG" >&2
            exit 1
          fi

      - name: Upload verification evidence (no distribution artifact)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: township-android-pilot-verification
          if-no-files-found: error
          path: output/android-pilot-verification/

  android_pilot:
    # Distribution is isolated from the secret-free verification job. Only a
    # main push or an explicit main-branch dispatch can enter the protected
    # environment and read pilot signing secrets.
    name: Android pilot distribution worker
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs:
      - verify
      - unit
      - packaged_macos
      - android_pilot_verify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: android-pilot
    permissions:
      contents: read
    outputs:
      distributed: ${{ steps.pilot.outputs.present }}
      pin_provisioned: ${{ steps.pilot_policy.outputs.provisioned }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            clients/lattice-client/package-lock.json
            clients/lattice-mobile-core/package-lock.json
            clients/township-tauri-shell/package-lock.json

      - name: Read reviewed pilot certificate pin
        id: pilot_policy
        run: |
          set -eu
          PIN="$(node --input-type=module -e \
            'import { TOWNSHIP_PILOT_CERT_SHA256 as pin } from "./clients/township-tauri-shell/scripts/android-pilot/pilot_policy.mjs"; process.stdout.write(pin ?? "")')"
          echo "cert_sha256=$PIN" >> "$GITHUB_OUTPUT"
          if [ "${#PIN}" -eq 64 ] && ! printf '%s' "$PIN" | grep -q '[^0-9a-f]'; then
            echo "provisioned=true" >> "$GITHUB_OUTPUT"
          else
            echo "provisioned=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect pilot signing secrets
        id: pilot
        env:
          KEYSTORE_B64: ${{ secrets.TOWNSHIP_PILOT_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TOWNSHIP_PILOT_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.TOWNSHIP_PILOT_KEY_PASSWORD }}
          PILOT_ALIAS: ${{ vars.TOWNSHIP_PILOT_KEY_ALIAS }}
          PINNED_CERT: ${{ vars.TOWNSHIP_PILOT_CERT_SHA256 }}
          REPO_PIN: ${{ steps.pilot_policy.outputs.cert_sha256 }}
          REQUIRE_PILOT: ${{ inputs.require_android_pilot || false }}
        run: |
          set -eu
          if [ -z "$KEYSTORE_B64" ]; then
            if [ "$REQUIRE_PILOT" = "true" ]; then
              echo "Pilot distribution was required but signing secrets are absent" >&2
              exit 1
            fi
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Pilot signing secrets absent; distribution skipped. Use require_android_pilot for a fail-closed release dispatch."
            exit 0
          fi
          if [ "${#REPO_PIN}" -ne 64 ] || printf '%s' "$REPO_PIN" | grep -q '[^0-9a-f]'; then
            echo "The reviewed in-repo pilot certificate pin is not provisioned" >&2
            exit 1
          fi
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ] || \
             [ "$PILOT_ALIAS" != "township-pilot-v1" ] || \
             [ "$(printf '%s' "$PINNED_CERT" | tr -d ':' | tr '[:upper:]' '[:lower:]')" != "$REPO_PIN" ]; then
            echo "Pilot signing inputs are incomplete or invalid" >&2
            exit 1
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Android NDK and Rust target
        if: steps.pilot.outputs.present == 'true'
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;27.1.12297006" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          rustup target add aarch64-linux-android
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"

      - name: Install client and shell dependencies
        if: steps.pilot.outputs.present == 'true'
        run: |
          npm --prefix clients/lattice-client ci
          npm --prefix clients/lattice-mobile-core ci
          npm --prefix clients/township-tauri-shell ci

      - name: Materialize signing key
        if: steps.pilot.outputs.present == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.TOWNSHIP_PILOT_KEYSTORE_B64 }}
        run: |
          set -eu
          KS="$RUNNER_TEMP/township-signing.jks"
          (umask 077; printf '%s' "$KEYSTORE_B64" | base64 -d > "$KS")
          echo "TOWNSHIP_PILOT_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"

      - name: Build signed release APK (pilot path)
        if: steps.pilot.outputs.present == 'true'
        working-directory: clients/township-tauri-shell
        env:
          TOWNSHIP_PILOT_KEYSTORE_PASSWORD: ${{ secrets.TOWNSHIP_PILOT_KEYSTORE_PASSWORD }}
          TOWNSHIP_PILOT_KEY_PASSWORD: ${{ secrets.TOWNSHIP_PILOT_KEY_PASSWORD }}
          TOWNSHIP_PILOT_KEY_ALIAS: ${{ vars.TOWNSHIP_PILOT_KEY_ALIAS }}
        run: |
          set -eu
          TOWNSHIP_ANDROID_VERSION_CODE="$(node scripts/android-pilot/version_code.mjs)"
          export TOWNSHIP_ANDROID_VERSION_CODE
          echo "versionCode=$TOWNSHIP_ANDROID_VERSION_CODE"
          npm run tauri:android:build:release -- --target aarch64

      - name: Verify, scan, and manifest pilot artifact
        if: steps.pilot.outputs.present == 'true'
        working-directory: clients/township-tauri-shell
        env:
          PINNED_CERT: ${{ vars.TOWNSHIP_PILOT_CERT_SHA256 }}
        run: |
          set -eu
          APK=src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
          mkdir -p ../../output/android-pilot
          node scripts/android-pilot/verify_apk_signature.mjs --apk "$APK" \
            --lineage pilot --expected-cert-sha256 "$PINNED_CERT" \
            --json ../../output/android-pilot/signature.json
          node scripts/android-pilot/scan_pilot_artifact.mjs --apk "$APK" --dist dist \
            --json ../../output/android-pilot/scan.json
          node scripts/android-pilot/emit_build_manifest.mjs --apk "$APK" \
            --lineage pilot --expected-cert-sha256 "$PINNED_CERT" \
            --out ../../output/android-pilot
          # Freeze the exact verified bytes before the negative Gradle probes
          # touch the build tree; distribution uploads only this staged copy.
          cp "$APK" ../../output/android-pilot/app-universal-release.apk

      - name: Prove pilot build remains fail-closed without signing inputs
        if: steps.pilot.outputs.present == 'true'
        working-directory: clients/township-tauri-shell/src-tauri/gen/android
        env:
          TOWNSHIP_ANDROID_SIGNING: pilot
          TOWNSHIP_PILOT_KEYSTORE_PATH: ""
          TOWNSHIP_PILOT_KEYSTORE_PASSWORD: ""
          TOWNSHIP_PILOT_KEY_PASSWORD: ""
        run: |
          set -eu
          PILOT_REFUSAL_LOG="$RUNNER_TEMP/pilot-refusal.log"
          UNSET_REFUSAL_LOG="$RUNNER_TEMP/unset-refusal.log"
          if ./gradlew --no-daemon -q packageUniversalRelease \
              -x rustBuildArm64Release -x rustBuildArmRelease \
              -x rustBuildX86Release -x rustBuildX86_64Release \
              -x rustBuildUniversalRelease > "$PILOT_REFUSAL_LOG" 2>&1; then
            echo "pilot-mode packaging must refuse without signing inputs" >&2
            exit 1
          fi
          if ! grep -q "TOWNSHIP_PILOT_KEYSTORE_PATH is not set" "$PILOT_REFUSAL_LOG"; then
            echo "expected pilot-mode keystore refusal; bounded diagnostics follow:" >&2
            tail -n 80 "$PILOT_REFUSAL_LOG" >&2
            exit 1
          fi
          if TOWNSHIP_ANDROID_SIGNING="" ./gradlew --no-daemon -q packageUniversalRelease \
              -x rustBuildArm64Release -x rustBuildArmRelease \
              -x rustBuildX86Release -x rustBuildX86_64Release \
              -x rustBuildUniversalRelease > "$UNSET_REFUSAL_LOG" 2>&1; then
            echo "unset-mode packaging must refuse" >&2
            exit 1
          fi
          if ! grep -q "release signing is fail-closed" "$UNSET_REFUSAL_LOG"; then
            echo "expected unset-mode refusal; bounded diagnostics follow:" >&2
            tail -n 80 "$UNSET_REFUSAL_LOG" >&2
            exit 1
          fi

      - name: Upload pilot artifact and manifest
        if: steps.pilot.outputs.present == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: township-android-pilot
          if-no-files-found: error
          path: output/android-pilot/

      - name: Job summary
        env:
          PILOT_PRESENT: ${{ steps.pilot.outputs.present }}
        run: |
          {
            echo "## Android pilot distribution"
            if [ "$PILOT_PRESENT" = "true" ]; then
              echo "- Lineage: **pilot** (protected android-pilot environment)"
              echo "- Signed APK + manifest uploaded as township-android-pilot"
            else
              echo "- Distribution skipped: pilot secrets are not configured."
            fi
            echo "- Device install and signed N-to-N+1 upgrade remain Device A gates."
          } >> "$GITHUB_STEP_SUMMARY"

  android_pilot_required:
    name: Android pilot distribution result
    if: always() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || inputs.require_android_pilot)
    needs: android_pilot
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Require successful distribution
        env:
          DISTRIBUTION_RESULT: ${{ needs.android_pilot.result }}
          DISTRIBUTED: ${{ needs.android_pilot.outputs.distributed }}
          PIN_PROVISIONED: ${{ needs.android_pilot.outputs.pin_provisioned }}
          REQUIRE_PILOT: ${{ inputs.require_android_pilot || false }}
        run: |
          if [ "$REQUIRE_PILOT" != "true" ] && [ "$PIN_PROVISIONED" != "true" ]; then
            echo "Android pilot distribution is not required until the reviewed repository pin is provisioned."
            exit 0
          fi
          if [ "$DISTRIBUTION_RESULT" != "success" ] || [ "$DISTRIBUTED" != "true" ]; then
            echo "Android pilot distribution did not produce an artifact: result=$DISTRIBUTION_RESULT distributed=${DISTRIBUTED:-false}" >&2
            exit 1
          fi
