name: Flagship evidence

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

jobs:
  verify:
    name: Verify flagship artifact
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: "28.1"
          elixir-version: "1.19.5"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Elixir dependencies
        run: mix deps.get

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Verify flagship evidence path
        env:
          LATTICE_SKIP_DEPS: "1"
          LATTICE_SKIP_PLAYWRIGHT_INSTALL: "1"
        run: scripts/lattice_verify_flagship.sh

      - name: Upload evidence artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lattice-flagship-evidence
          if-no-files-found: warn
          path: |
            output/playwright/
            output/flagship/

  unit:
    name: Unit + property suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: "28.1"
          elixir-version: "1.19.5"
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            clients/lattice-client/package-lock.json
            clients/township-tauri-shell/package-lock.json
      - name: Cache deps and _build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-
      - name: Install dependencies
        run: mix deps.get
      - name: Check formatting
        run: mix format --check-formatted
      - name: Run full test suite
        run: mix test
      - name: Regenerate TS oracle vectors
        run: mix lattice.export_vectors --out clients/lattice-client/test/vectors
      - name: Install TS client dependencies
        working-directory: clients/lattice-client
        run: npm ci
      - name: Typecheck TS client
        working-directory: clients/lattice-client
        run: npm run typecheck
      - name: TS client conformance
        working-directory: clients/lattice-client
        run: npm run conformance
      - name: TS canonical op parity
        working-directory: clients/lattice-client
        run: npm run canonical
      - name: TS Township authoring
        working-directory: clients/lattice-client
        run: npm run township:authoring
      - name: TS Tauri bridge
        working-directory: clients/lattice-client
        run: npm run tauri:bridge
      - name: Install Township shell dependencies
        working-directory: clients/township-tauri-shell
        run: npm ci
      - name: Typecheck Township shell
        working-directory: clients/township-tauri-shell
        run: npm run typecheck
      - name: Township session lifecycle contract
        working-directory: clients/township-tauri-shell
        run: npm run session:contract
      - name: Township frontend contract
        working-directory: clients/township-tauri-shell
        run: npm run frontend:contract
      - name: Build Township shell
        working-directory: clients/township-tauri-shell
        run: npm run build
      - name: Tauri native command core
        working-directory: clients/township-tauri-shell/src-tauri
        run: cargo test
      - name: TS carrier Township check
        working-directory: clients/lattice-client
        run: npm run carrier:township
      - name: TS live carrier Township check
        working-directory: clients/lattice-client
        run: npm run carrier:township:live
      - name: Credo (strict)
        run: mix credo --strict
      - name: Sobelow (lattice_server)
        run: cd apps/lattice_server && mix sobelow --exit
